# Publishes the static frontend to GitHub Pages on every push to main.
# Only public site files are deployed — never server/, databases, .env or local tools.
# The published copy is a preview: no backend, so the lead form uses its Telegram
# fallback, and pages carry noindex. The local version (with backend) is unchanged.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Assemble public site (frontend only)
        run: |
          set -euo pipefail
          mkdir _site
          cp -R index.html favicon.ico css js content assets pages _site/

          # No backend on GitHub Pages: validate, then suggest Telegram (no request to /api/leads).
          sed -i 's/leadForm: true,/leadForm: false,/' _site/js/config.js
          grep -q 'leadForm: false,' _site/js/config.js

          # Preview must not be indexed by search engines.
          for page in _site/index.html _site/pages/cases/case.html; do
            sed -i 's#<meta charset="utf-8">#<meta charset="utf-8">\n  <meta name="robots" content="noindex, nofollow">#' "$page"
            grep -q '<meta name="robots" content="noindex, nofollow">' "$page"
          done

          # Guard: nothing private may end up in the artifact.
          if find _site \( -path '*/server*' -o -name '*.db' -o -name '.env*' -o -name '*.app' -o -name '*.py' \) | grep -q .; then
            echo "Private files found in _site" >&2
            exit 1
          fi
          echo "Deployed files:"
          find _site -type f | sort

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
